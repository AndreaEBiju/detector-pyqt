[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detector-pyqt"
version = "0.0.0"
description = "PyQt + pyqtgraph desktop UI for the motion-artifact detector."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andrea Elizabeth Biju" },
]

dependencies = [
    # GUI stack
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    # Detector backend deps (imported via the detector-core/ submodule).
    # numpy is pinned <2 because: (a) the Streamlit UI's pyproject pins
    # 1.26.4, (b) several anaconda-bundled packages (contourpy,
    # pywavelets) don't yet support numpy 2.x, and (c) shap's transitive
    # numba upgrade will silently pull in numpy 2 otherwise.
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "h5py>=3.10",
    "lightgbm>=4.0",
    # Optional but referenced by detector.review (SHAP explanations).
    # Cap to a version that still works with numba 0.59 / numpy 1.26.
    "shap>=0.44,<0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[project.scripts]
detector-pyqt = "ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `from detector import ...` work in tests by injecting the
# submodule path. conftest.py at repo root mirrors this for dev runs.
pythonpath = ["detector-core"]
