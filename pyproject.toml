[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detector-pyqt"
version = "0.0.0"
description = "PyQt + pyqtgraph desktop UI for the motion-artifact detector."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andrea Elizabeth Biju" },
]

dependencies = [
    # GUI stack
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    # Detector backend deps (imported via the detector-core/ submodule)
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "h5py>=3.10",
    "lightgbm>=4.0",
    # Optional but referenced by detector.review (SHAP explanations)
    "shap>=0.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[project.scripts]
detector-pyqt = "ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `from detector import ...` work in tests by injecting the
# submodule path. conftest.py at repo root mirrors this for dev runs.
pythonpath = ["detector-core"]
