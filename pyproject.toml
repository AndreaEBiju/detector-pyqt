[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detector-pyqt"
version = "0.0.0"
description = "PyQt + pyqtgraph desktop UI for the motion-artifact detector."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andrea Elizabeth Biju" },
]

dependencies = [
    # GUI stack
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    # Upper bound 2 -> 3, in lockstep with detector-core's own pin , measured:
    # this suite runs under numpy 2.5.3 / scipy 1.18.1 / shap 0.52.0 /
    # numba 0.67.0 on python 3.12 (the <2 pin had not matched the tested
    # environment for some time). <3, not unbounded: declared = tested.
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "h5py>=3.10",
    # Registers HDF5 compression filters (LZ4 / zstd / blosc) so the
    # splitter's compressed clean/bad/baseline H5 files can be read.
    "hdf5plugin>=4.0",
    # Used by detector.dataset to size the parallel Phase 1 worker
    # pool based on actual machine RAM. Without it, the worker count
    # falls back to a CPU-only heuristic capped at 8.
    "psutil>=5.0",
    "lightgbm>=4.0",
    # Optional but referenced by detector.review (SHAP explanations).
    # Cap raised 0.50 -> 0.53 for numpy 2: 0.52.0 is the tested version.
    "shap>=0.44,<0.53",
    # detector.review embeds matplotlib figures in the per-fold SHAP
    # review HTMLs. It's imported by ui.windows.main_window indirectly,
    # so the UI fails to start without it.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[project.scripts]
detector-pyqt = "ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `from detector import ...` work in tests by injecting the
# submodule path. conftest.py at repo root mirrors this for dev runs.
pythonpath = ["detector-core"]
